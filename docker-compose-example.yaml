services:
  # Local PostgreSQL for development (NODE_ENV=local)
  postgresql:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: nest-app-postgresql
    environment:
      POSTGRES_USER: ${LOCAL_DB_USER:-nest_user}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-nest_password}
      POSTGRES_DB: ${LOCAL_DB_NAME:-nest_app}
    ports:
      - "5433:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: always
    networks:
      - db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCAL_DB_USER:-nest_user} -d ${LOCAL_DB_NAME:-nest_app}",
        ]
      timeout: 5s
      interval: 15s
      retries: 10

  nest-starter-api:
    build:
      context: ./root_src
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: nest-app-api
    working_dir: /var/www/app
    ports:
      - "3004:3004"
    volumes:
      - ./root_src:/var/www/app
      - ./files:/var/www/files
      - pnpm_store:/root/.local/share/pnpm/store
      - node_modules_cache:/var/www/app/node_modules
    command: sh -c "pnpm install && pnpm run start:dev"
    restart: always
    env_file:
      - ./root_src/.env
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - db
      - monitoring
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.nest-api.rule=Host(`my.upnvj-api.local`)"
      - "traefik.http.services.nest-api.loadbalancer.server.port=3004"

  redis:
    image: redis:6.2-alpine
    restart: always
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning --requirepass admin123
    volumes:
      - cache:/data
    networks:
      - db

  # ==========================================================================
  # OBSERVABILITY & MONITORING STACK
  # ==========================================================================

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./root_src/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    environment:
      - TZ=Asia/Jakarta
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - TZ=Asia/Jakarta
    volumes:
      - grafana-data:/var/lib/grafana
      - ./root_src/config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./root_src/config/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./root_src/config/grafana/dashboards/dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    user: "root"
    volumes:
      - ./root_src/config/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    environment:
      - TZ=Asia/Jakarta
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    privileged: true
    ports:
      - "12345:12345"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./root_src/config/alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    environment:
      - ALLOY_OTLP_UPSTREAM=tempo:4317
      - TZ=Asia/Jakarta
    networks:
      - monitoring
    depends_on:
      - loki
      - tempo

  tempo:
    image: grafana/tempo:main-814c1c6
    container_name: tempo
    user: root
    command: "-target=all -config.file=/etc/tempo.yaml"
    volumes:
      - ./root_src/config/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200" # HTTP
      - "4317" # OTLP gRPC (internal)
      - "4318" # OTLP HTTP (internal)
    environment:
      - TZ=Asia/Jakarta
    networks:
      - monitoring

volumes:
  postgresql_data:
  pnpm_store:
  node_modules_cache:
  cache:
    driver: local
  grafana-data:
    name: grafana-data
  loki-data:
    name: loki-data
  tempo-data:
    name: tempo-data

networks:
  db:
    external: true
  monitoring:
    name: monitoring
    driver: bridge
